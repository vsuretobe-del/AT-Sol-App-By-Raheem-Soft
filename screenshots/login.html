<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,Arial,sans-serif; }
  body { width:412px; height:892px; overflow:hidden;
    background:linear-gradient(135deg,#1A237E 0%,#534BAE 100%); }
  .safe { padding:28px 24px 0; }
  .logo { display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:26px; }
  .logo .ic { width:72px; height:72px; border-radius:18px; background:rgba(255,255,255,.15);
    display:flex; align-items:center; justify-content:center; font-size:40px; }
  h1 { color:#fff; font-size:34px; font-weight:700; letter-spacing:.5px; }
  .tag { color:rgba(255,255,255,.85); font-size:15px; margin-top:-6px; }
  .card { background:#fff; border-radius:18px; padding:22px; margin-top:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.25); }
  .serverbtn { display:flex; align-items:center; gap:8px; justify-content:center;
    color:#616161; font-size:13px; padding:6px 0 14px; border:none; background:none; width:100%;
    border-bottom:1px dashed #e0e0e0; margin-bottom:16px; }
  .field { position:relative; margin-bottom:16px; }
  .field label { position:absolute; top:-9px; left:12px; background:#fff; padding:0 5px;
    font-size:12px; color:#1A237E; font-weight:600; }
  .field input { width:100%; height:50px; border:1px solid #DADCE0; border-radius:10px;
    padding:0 44px 0 46px; font-size:15px; outline:none; color:#202124; }
  .field .pre { position:absolute; left:14px; top:14px; opacity:.55; font-size:19px; }
  .field .suf { position:absolute; right:12px; top:13px; opacity:.45; font-size:19px; }
  .signin { width:100%; height:50px; border-radius:12px; border:none; background:#1A237E;
    color:#fff; font-size:16px; font-weight:600; display:flex; align-items:center;
    justify-content:center; gap:10px; margin-top:4px; box-shadow:0 3px 8px rgba(26,35,126,.35); }
  .credit { text-align:center; color:rgba(255,255,255,.6); font-size:12px; margin-top:26px; }
</style>
</head>
<body>
  <div class="safe">
    <div class="logo">
      <div class="ic">📦</div>
      <h1>AT Sol</h1>
      <div class="tag">Ahsan Traders Solutions</div>
    </div>

    <div class="card">
      <button class="serverbtn">🖧&nbsp; https://yourdomain.com/atsol</button>

      <div class="field">
        <label>Username</label>
        <span class="pre">👤</span>
        <input value="admin">
      </div>

      <div class="field">
        <label>Password</label>
        <span class="pre">🔒</span>
        <input type="password" value="••••••••">
        <span class="suf">🙈</span>
      </div>

      <button class="signin">→&nbsp; Sign In</button>
    </div>

    <div class="credit">Software by Raheem Soft</div>
  </div>
</body>
</html>
